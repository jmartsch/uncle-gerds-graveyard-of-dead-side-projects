<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uncle Gerd's Museum</title>
    <meta name="description" content="A personal agent on a Fly.io Sprite turns your dead side projects into a walkable pixel museum and tries to bring them back to life." />
    <meta name="theme-color" content="#1a1016" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%233a1d2b'/%3E%3Cpath d='M4 15V7a4 4 0 0 1 8 0v8z' fill='%237a2f22' stroke='%23d9a441'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <h1>Uncle Gerd's Museum <span>of Dead Side Projects</span></h1>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="museum" aria-pressed="true">Museum</button>
        <button type="button" data-theme-choice="graveyard" aria-pressed="false">Graveyard</button>
      </div>
      <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="false" title="Toggle the 8-bit soundtrack (M)">♪ Sound off</button>
      <form id="visit-form" class="visit" role="search" aria-label="Visit any GitHub user's graveyard">
        <label for="visit-name">Your graveyard:</label>
        <input id="visit-name" name="user" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="GitHub username" maxlength="60" required />
        <button type="submit">Dig</button>
      </form>
      <p id="banner" class="banner" hidden></p>
    </header>

    <main>
      <section id="digging" class="digging" hidden>
        <h2 id="digging-title">Uncle Gerd is digging…</h2>
        <div class="dig-stage">
          <div id="digging-portrait"></div>
          <p id="dig-bubble" class="dig-bubble" aria-live="polite">Moment, Junge. Let me get my shovel.</p>
        </div>
        <p id="digging-status" role="status"></p>
        <div id="dig-meter" class="dig-meter">
          <div id="dig-progress" class="dig-progress" role="progressbar" aria-label="Excavation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <span id="dig-clock" class="dig-clock" aria-label="Time spent digging">0:00</span>
        </div>
      </section>
      <div id="game" tabindex="0" role="application" aria-label="The museum hallway. Walk with the arrow keys, enter a room with the up arrow, or use the list of exhibits below."></div>

      <nav class="touch" aria-label="Walking controls">
        <button type="button" data-move="-1" aria-label="Walk left">◀</button>
        <button type="button" id="enter" disabled>Enter</button>
        <button type="button" data-move="1" aria-label="Walk right">▶</button>
      </nav>

      <p class="hint">
        <kbd>←</kbd> <kbd>→</kbd> walk · <kbd>↑</kbd> enter a room · <kbd>Esc</kbd> leave · <kbd>M</kbd> sound ·
        <button type="button" id="list-toggle" class="linklike" aria-expanded="false" aria-controls="list">all exhibits</button>
      </p>

      <section id="list" hidden aria-label="All exhibits">
        <ul></ul>
      </section>
    </main>

    <footer class="colophon">
      A personal agent living on a <a href="https://fly.io/sprites" target="_blank" rel="noopener">Fly.io Sprite</a>.
      Built for Hacksgiving 2026.
    </footer>

    <dialog id="room" aria-labelledby="room-title"></dialog>
    <p id="toast" class="toast" role="status" hidden></p>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="/museum.js"></script>
  </body>
</html>
